name: Build DailyQuests
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DailyQuests-1.0.1
          path: target/DailyQuests-1.0.1.jar
          if-no-files-found: error
