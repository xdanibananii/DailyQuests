name: DailyQuests
version: 1.0.1
main: pl.dailyquests.DailyQuestsPlugin
api-version: '26.3'
author: DailyQuests
description: Indywidualne zadania i kontrakty z Michaiłem Łomonosowem.
commands:
  zadania:
    description: Otwiera zadania, ranking i wyzwanie tygodnia.
    usage: /zadania | /dq help | /dq weekly | /dq top | /dq skrzynka | /dq gwiazdki | /dq roll | /dq nether [on|off] | /dq end [on|off] | /dq reload
    aliases: [dailyquests, dq]
permissions:
  dailyquests.admin:
    description: Zarządzanie pluginem DailyQuests.
    default: op
