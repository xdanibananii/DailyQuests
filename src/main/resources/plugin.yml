name: DailyQuests
version: 1.0.11
main: pl.dailyquests.DailyQuestsPlugin
api-version: '26.3'
author: DailyQuests
description: Indywidualne zadania i kontrakty z Michaiłem Łomonosowem.
commands:
  zadania:
    description: Otwiera zadania, ranking i wyzwanie tygodnia.
    usage: /dailyquest | /dq | /zadania | /dq weekly | /dq top | /dq gwiazdki | /dq npc <questy|skarbiec> [postaw|usun|tp]
    aliases: [dailyquests, dailyquest, dq]
permissions:
  dailyquests.admin:
    description: Zarządzanie pluginem DailyQuests.
    default: op
