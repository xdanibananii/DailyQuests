name: DailyQuests
version: 1.0.27
main: pl.dailyquests.DailyQuestsPlugin
api-version: '26.3'
author: danibanannii
description: Zadania, kontrakty, skrzynki i wyprawy po skarby.
commands:
  zadania:
    description: Otwiera zadania, ranking i wyzwanie tygodnia.
    usage: /dailyquest | /dq | /zadania | /dq weekly | /dq top | /dq gwiazdki | /dq npc <quest|skarbiec|kartograf|filip|snaf> [postaw|usun|tp|rename]
    aliases: [dailyquests, dailyquest, dq]
permissions:
  dailyquests.admin:
    description: Zarządzanie pluginem DailyQuests.
    default: op
