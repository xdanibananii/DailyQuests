name: DailyQuests
version: 1.0.0
main: pl.dailyquests.DailyQuestsPlugin
api-version: '26.3'
author: DailyQuests
description: Indywidualne codzienne zadania dla graczy.
commands:
  zadania:
    description: Otwiera zadania, ranking i wyzwanie tygodnia.
    usage: /zadania | /dq weekly | /dq top | /dq roll | /dq nether [off] | /dq end [off]
    aliases: [dailyquests, dq]
permissions:
  dailyquests.admin:
    description: Zarządzanie pluginem DailyQuests.
    default: op
